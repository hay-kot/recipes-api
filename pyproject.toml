[project]
name = "recipes-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.1",
  "ingredient-parser-nlp==2.7.0",
  "recipe-scrapers==15.12.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "beautifulsoup4==4.15.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
ignore = ["F403", "B008"]
select = [
  "E", # pycodestyles
  "F", # pyflakes
  "I", # isort
  "T", # flake8-print
  "B", # flake8-bugbear
]
